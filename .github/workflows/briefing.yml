name: Briefing geopolitico

on:
  schedule:
    # 05:30 UTC = 07:30 ora italiana (estate) / 06:30 (inverno)
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write        # serve per ricommittare visti.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install feedparser anthropic trafilatura requests python-dateutil beautifulsoup4

      - name: Genera il briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python genera_briefing.py --giorni 1

      - name: Salva l'archivio degli articoli visti
        run: |
          if [[ -n "$(git status --porcelain visti.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add visti.json
            git commit -m "Archivio articoli visti — $(date +%F)"
            # se nel frattempo main e' cambiato, riallineo prima di spingere
            git pull --rebase --autostash origin main
            git push
          else
            echo "Nessuna modifica all'archivio."
          fi

      - name: Prepara il sito
        run: |
          mkdir -p public/archivio
          cp "$(ls -t briefing_*.html | head -1)" public/index.html
          cp briefing_*.html public/archivio/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  pubblica:
    needs: genera
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
